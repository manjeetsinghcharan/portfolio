<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Dirt background -->
  <rect width="16" height="16" fill="#6d4928"/>
  <!-- Dark dirt spots -->
  <rect x="2" y="8" width="2" height="2" fill="#54371d"/>
  <rect x="7" y="11" width="3" height="2" fill="#54371d"/>
  <rect x="12" y="7" width="2" height="2" fill="#54371d"/>
  <rect x="4" y="13" width="2" height="2" fill="#54371d"/>
  <rect x="11" y="13" width="3" height="2" fill="#54371d"/>
  <!-- Light dirt spots -->
  <rect x="5" y="7" width="2" height="2" fill="#845a33"/>
  <rect x="10" y="9" width="2" height="2" fill="#845a33"/>
  <rect x="1" y="11" width="2" height="2" fill="#845a33"/>
  <rect x="8" y="14" width="2" height="2" fill="#845a33"/>
  <!-- Grass top layer -->
  <rect x="0" y="0" width="16" height="4" fill="#5b8c32"/>
  <!-- Grass highlights -->
  <rect x="1" y="0" width="3" height="1" fill="#78b13f"/>
  <rect x="6" y="0" width="4" height="1" fill="#78b13f"/>
  <rect x="12" y="0" width="3" height="1" fill="#78b13f"/>
  <rect x="3" y="1" width="2" height="1" fill="#78b13f"/>
  <rect x="9" y="1" width="2" height="1" fill="#78b13f"/>
  <!-- Grass dark shadow -->
  <rect x="0" y="3" width="2" height="1" fill="#446a25"/>
  <rect x="4" y="3" width="3" height="1" fill="#446a25"/>
  <rect x="9" y="3" width="2" height="1" fill="#446a25"/>
  <rect x="13" y="3" width="3" height="1" fill="#446a25"/>
  <!-- Grass overhang drips -->
  <rect x="1" y="4" width="1" height="2" fill="#5b8c32"/>
  <rect x="3" y="4" width="2" height="1" fill="#5b8c32"/>
  <rect x="4" y="5" width="1" height="1" fill="#446a25"/>
  <rect x="7" y="4" width="1" height="3" fill="#5b8c32"/>
  <rect x="8" y="4" width="1" height="1" fill="#5b8c32"/>
  <rect x="11" y="4" width="2" height="2" fill="#5b8c32"/>
  <rect x="14" y="4" width="1" height="2" fill="#446a25"/>
  <rect x="15" y="4" width="1" height="1" fill="#5b8c32"/>
</svg>
